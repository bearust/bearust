services:
  bearust:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--config", "/etc/bearust/bearust.toml", "--json-logs"]
    ports:
      - "${BEARUST_PORT:-8080}:8080"
      - "${BEARUST_CONTROL_PORT:-8081}:8081"
    volumes:
      - "${BEARUST_CONFIG:-./config/bearust.example.toml}:/etc/bearust/bearust.toml:ro"
      - "${BEARUST_DATA:-./data}:/data"
      - "${BEARUST_TLS:-./tls}:/etc/bearust/tls:ro"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      BEARUST_SETUP_TOKEN: "${BEARUST_SETUP_TOKEN:-}"
    working_dir: /run/bearust
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /run/bearust:uid=10001,gid=10001,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
