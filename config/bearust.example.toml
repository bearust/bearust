[server]
# Plain HTTP. Hosts with TLS enabled and a certificate are redirected to HTTPS.
bind = "0.0.0.0:8080"
# HTTPS with a per-host certificate selected by SNI (assign certificates to
# proxy hosts in the dashboard). Unknown hostnames get a self-signed default.
https_bind = "0.0.0.0:8443"
# Port in redirect URLs; Docker Compose maps host 443 -> container 8443.
https_public_port = 443
# Container-reachable bind; Docker Compose publishes this port on host localhost only.
control_bind = "0.0.0.0:8081"
control_database = "/data/bearust.sqlite"
pid_file = "/run/bearust/bearust.pid"
certificate_store = "/data/certificates"
# Optional MaxMind GeoLite2/GeoIP2 Country database for country-based IP rules.
# geoip_database = "/data/GeoLite2-Country.mmdb"

# Optional AI Advisor provider settings are supplied as environment variables,
# never in this file. Leave LLM_API_URL/LLM_API_KEY unset to disable the advisor.
# See DEPLOY.md for redaction, retention, and self-hosted provider guidance.

# Optional native TLS. Both paths are required when this block is enabled.
# [server.tls]
# cert_path = "/etc/bearust/tls/fullchain.pem"
# key_path = "/etc/bearust/tls/privkey.pem"

# Health timings are in seconds; safe defaults apply when omitted.
[health]

[[upstream_pools]]
name = "api"
# Supported algorithms: round_robin, least_connections, or plugin.
algorithm = "round_robin"

[[upstream_pools.backends]]
address = "127.0.0.1:9001"
# Checks are tcp or http; HTTP checks require health_path.
health_check = "http"
health_path = "/health"

[[upstream_pools.backends]]
address = "127.0.0.1:9002"
health_check = "tcp"

[[routes]]
name = "api-v1"
host = "api.example.com"
path_prefix = "/v1"
upstream_pool = "api"

[[routes]]
name = "api-root"
host = "api.example.com"
path_prefix = "/"
upstream_pool = "api"
