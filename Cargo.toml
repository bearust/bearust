[package]
name = "bearust"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
description = "Open source reverse proxy and load balancer"

[dependencies]
arc-swap = "1.7"
openssl = "=0.10.68"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
http = "1"
nix = { version = "0.29", features = ["process", "signal"] }
signal-hook = "0.3"
pingora-core = "0.8.1"
pingora-error = "0.8.1"
pingora-http = "0.8.1"
pingora-proxy = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "blocking"] }
tempfile = "3"
tokio-tungstenite = "0.27"

[profile.release]
lto = "thin"
strip = true
