[package]
name = "bearust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Open source reverse proxy and load balancer"

[dependencies]
arc-swap = "1.7"
bytes = "1"
base64 = "0.22"
openssl = "=0.10.68"
instant-acme = "=0.7.2"
async-trait = "0.1"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "=4.5.32", features = ["derive"] }
http = "1"
http-body-util = "0.1"
futures-util = "0.3"
nix = { version = "0.29", features = ["process", "signal"] }
openraft = { version = "=0.9.21", default-features = false, features = ["serde", "serde_json", "storage-v2"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "native-tls"] }
regex = "1"
signal-hook = "0.3"
pingora-core = { version = "0.8.1", features = ["rustls"] }
pingora-error = "0.8.1"
pingora-http = "0.8.1"
pingora-proxy = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "any", "sqlite", "postgres", "mysql", "migrate", "uuid", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = "=27.0.0"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "blocking"] }
tempfile = "3"
tokio-tungstenite = "0.27"
tower = { version = "0.5", features = ["util"] }
wat = "1"

[profile.release]
lto = "thin"
strip = true
