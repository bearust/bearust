name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case motivates this request?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should BeaRust do, and how would you configure or use it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Proxy / load balancing
        - TLS / ACME
        - Dashboard / control plane
        - WAF / bot / rate limiting
        - Analytics / observability
        - Clustering / HA
        - Plugins
        - Localization
        - Documentation
        - Other
    validations:
      required: true
